# Render Blueprint for the website (GUIDE §5.2, §10.3).
# Render → New → Blueprint → this repo. Render reads this file on every sync;
# headers and routes not listed here but added in the Dashboard are kept.
services:
  - type: web
    runtime: static
    name: cinemakom-website
    # Check, test and build in one go: if any step fails, Render keeps serving
    # the last good deploy (and in CI the build fails when the release can't
    # be read or has no Android files, so a broken page is never published).
    buildCommand: npm ci && npm run check && npm test && npm run lint:rtl && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    previews:
      generation: off
    domains:
      - cinemakom.sharon-xa.com
    envVars:
      # We install dependencies ourselves with `npm ci` (reproducible, from
      # package-lock.json), so Render shouldn't install them first.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # A fine-grained GitHub token with read-only access to public
      # repositories and no other permission. Render's build machines share
      # IP addresses, so the anonymous API limit (60 an hour) can run out.
      # Set its value in the Dashboard; it never goes in this file.
      - key: GITHUB_TOKEN
        sync: false
    headers:
      # Hashed files (fonts, images, nothing else lives here) never change.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Read by the 6-hourly release check: always fresh.
      - path: /version.json
        name: Cache-Control
        value: no-cache
      # Only this site and GitHub's API (the in-page refresh). No other third
      # party can load anything, even by mistake. Inline styles and the one
      # inline script are ours; structured data is not executed.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), browsing-topics=()
    routes:
      # Rules only apply where no file exists. People type the TV address on a
      # remote: accept it without the slash and with capitals too.
      - type: redirect
        source: /tv
        destination: /tv/
      - type: redirect
        source: /TV
        destination: /tv/
      - type: redirect
        source: /Tv
        destination: /tv/
      - type: redirect
        source: /TV/
        destination: /tv/
      - type: redirect
        source: /en/tv
        destination: /en/tv/
      - type: redirect
        source: /en/TV
        destination: /en/tv/
      - type: redirect
        source: /en
        destination: /en/
